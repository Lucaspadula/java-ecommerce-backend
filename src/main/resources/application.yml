spring:
  application:
    name: sistventas-backend

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sistventas}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

sistventas:
  jwt:
    # Sin default: si JWT_SECRET no está seteada, el backend no arranca.
    # Un secret hardcodeado en el repo permite firmar tokens válidos de
    # cualquier usuario, incluido el super-admin.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas
  super-admin:
    # Credenciales del primer Super Admin bootstrapeado al arrancar si no
    # existe ninguno todavía. Sin default de password: forzar a setearla
    # explícitamente evita quedar con una contraseña conocida/pública.
    email: ${SUPER_ADMIN_EMAIL:admin@sistventas.com}
    password: ${SUPER_ADMIN_PASSWORD}
  google:
    # Client ID de Google Identity Services (dato público, va embebido en el
    # frontend también). En producción se puede sobreescribir vía la
    # variable de entorno GOOGLE_CLIENT_ID.
    client-id: ${GOOGLE_CLIENT_ID:248720521704-utcntiogv25vh6eu4dup5kvo64gtgrtf.apps.googleusercontent.com}
